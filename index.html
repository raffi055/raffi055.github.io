<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple Responsive Website</title>
<style>
  /* Reset and basic styles */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    color: #333;
  }
  a {
    color: #007bff;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  header {
    background: #c119be;
    color: white;
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  nav .logo {
    font-weight: bold;
    font-size: 1.5rem;
  }
  nav ul {
    list-style: none;
    display: flex;
    margin: 0;
    padding: 0;
  }
  nav li {
    margin-left: 1.5rem;
  }
  nav a {
    color: white;
    font-weight: 600;
  }
  main {
    padding: 2rem;
    max-width: 1000px;
    margin: auto;
  }
  section {
    margin-bottom: 3rem;
  }
  .hero {
    text-align: center;
    padding: 3rem 1rem;
    background: #e9f0ff;
    border-radius: 8px;
  }
  .hero h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }
  .hero p {
    font-size: 1.2rem;
    color: #555;
  }
  h2 {
    border-bottom: 3px solid #e600ff;
    padding-bottom: 0.25rem;
    margin-bottom: 1rem;
    color: #b002a8;
  }
  .services {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 1.5rem;
  }
  .service-card {
    background: #f5faff;
    padding: 1.5rem;
    border-radius: 8px;
    box-shadow: 0 0 10px rgb(0 123 255 / 0.1);
  }
  form {
    max-width: 400px;
    margin: auto;
  }
  label {
    display: block;
    margin-bottom: 0.25rem;
    font-weight: 600;
  }
  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 0.5rem;
    margin-bottom: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
  }
  button {
    background: #bb00ff;
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background: #8300b3;
  }
  footer {
    text-align: center;
    padding: 1rem;
    background: #f5f5f5;
    color: #666;
    font-size: 0.9rem;
  }
  @media (max-width: 600px) {
    nav ul {
      flex-direction: column;
      background: #a600ff;
      position: absolute;
      top: 58px;
      right: 0;
      width: 100%;
      display: none;
    }
    nav ul.show {
      display: flex;
    }
    nav li {
      margin: 1rem 0;
      text-align: center;
    }
    .menu-toggle {
      display: block;
      cursor: pointer;
      font-size: 1.5rem;
      user-select: none;
    }
  }
  .menu-toggle {
    display: none;
  }
</style>
</head>
<body>
<header>
  <nav>
    <div class="logo">ABSTRK</div>
    <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    <ul id="nav-links">
      <li><a href="#hero">Home</a></li>
      <li><a href="#services">Deskripsi</a></li>
      <li><a href="#contact">Pertanyaan</a></li>
    </ul>
  </nav>
</header>

<main>
  <section id="hero" class="hero">
    <h1>Welcome to ABSTRK Website</h1>
    <p>gw cuman mau nanyain sesuatu.</p>
  </section>



  <section id="services">
    <h2>Tentang gw</h2>
    <div class="services">
      <div class="service-card">
        <h3>NAMA</h3>
        <p>Anugerah Raffi Alfahrizi Wibowo</p>
        <p>(abstrak)</p>
      </div>
      <div class="service-card">
        <h3>SEKOLAH</h3>
        <p>SMK NEGERI 1 NGLIPAR</p>
      </div>
      <div class="service-card">
        <h3>KELAS</h3>
        <p>XI TKJ 2</p>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2>pertanyaan</h2>
    <form id="contact-form" onsubmit="submitForm(event)">
      <label for="name">Nama(opsi):</label>
      <input type="text" id="name" name="name" required />

      <label for="email">gw gimana sih orangnya?:</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Lengkapnya tulis sini:</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <button type="submit">Send</button>
    </form>
  </section>
</main>

<footer>
  &copy; 2025 ABSTRK.
</footer>

<script>
  // Toggle mobile nav menu
  const menuToggle = document.getElementById('menu-toggle');
  const navLinks = document.getElementById('nav-links');

  menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('show');
  });

  // Smooth scroll for nav links
  document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      navLinks.classList.remove('show');
      const target = document.querySelector(link.getAttribute('href'));
      target.scrollIntoView({
        behavior: 'smooth'
      });
    });
  });

  // Form submission handler (simulated)
  function submitForm(event) {
    event.preventDefault();
    const form = event.target;
    alert(`Thank you, ${form.name.value}! Your message has been received.`);
    form.reset();
  }
</script>
</body>
</html>
